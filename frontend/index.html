    <style>
      /* Preloader styles - inline for instant display */
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1a0f0a 0%, #2d1810 50%, #1a0f0a 100%);
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      #preloader.loaded {
        opacity: 0;
        visibility: hidden;
      }
      .preloader-icon {
        opacity: 0;
        animation: preloaderFadeIn 0.6s ease forwards 0.1s, preloaderPulse 1.8s ease-in-out infinite 0.7s;
      }
      .preloader-logo {
        font-family: 'Playfair Display', serif;
        font-size: 2.5rem;
        font-weight: 700;
        color: #fff;
        letter-spacing: -0.02em;
        margin-top: 1.5rem;
        margin-bottom: 0.5rem;
        opacity: 0;
        animation: preloaderFadeIn 0.8s ease forwards 0.3s;
      }
      .preloader-logo span {
        color: #e8632b;
      }
      .preloader-tagline {
        font-family: 'DM Sans', sans-serif;
        font-size: 0.875rem;
        color: rgba(255,255,255,0.5);
        margin-top: 1.5rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        opacity: 0;
        animation: preloaderFadeIn 0.6s ease forwards 0.8s;
      }
      @keyframes preloaderFadeIn {
        to { opacity: 1; }
      }
      @keyframes preloaderPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.1); opacity: 0.8; }
      }
    </style>
  </head>

  <body>
    <div id="preloader">
      <div class="preloader-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="72" height="72">
          <defs>
            <linearGradient id="pre-zaika" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#C2410C" />
              <stop offset="55%" stop-color="#EA580C" />
              <stop offset="100%" stop-color="#F59E0B" />
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#pre-zaika)" />
          <rect x="6" y="6" width="52" height="52" rx="12" stroke="#FDE68A" stroke-opacity="0.35" stroke-width="1.5" />
          <path d="M20 21H43L21 43H44" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M46 13L47.6 16.4L51 18L47.6 19.6L46 23L44.4 19.6L41 18L44.4 16.4L46 13Z" fill="#FDE68A" />
        </svg>
      </div>
      <div class="preloader-logo">Zai<span>ka</span></div>
      <div class="preloader-tagline">Bold Flavors · Smart Macros</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
