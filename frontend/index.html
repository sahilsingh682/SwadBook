    <style>
      /* Preloader styles - inline for instant display */
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1a0f0a 0%, #2d1810 50%, #1a0f0a 100%);
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      #preloader.loaded {
        opacity: 0;
        visibility: hidden;
      }
      .preloader-icon {
        opacity: 0;
        animation: preloaderFadeIn 0.6s ease forwards 0.1s, preloaderPulse 1.8s ease-in-out infinite 0.7s;
      }
      .preloader-logo {
        font-family: 'Playfair Display', serif;
        font-size: 2.5rem;
        font-weight: 700;
        color: #fff;
        letter-spacing: -0.02em;
        margin-top: 1.5rem;
        margin-bottom: 0.5rem;
        opacity: 0;
        animation: preloaderFadeIn 0.8s ease forwards 0.3s;
      }
      .preloader-logo span {
        color: #e8632b;
      }
      .preloader-tagline {
        font-family: 'DM Sans', sans-serif;
        font-size: 0.875rem;
        color: rgba(255,255,255,0.5);
        margin-top: 1.5rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        opacity: 0;
        animation: preloaderFadeIn 0.6s ease forwards 0.8s;
      }
      .preloader-icon-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        animation: preloaderFadeIn 0.5s ease forwards 0.05s, preloaderFloat 2.2s ease-in-out infinite 0.5s;
      }
      .preloader-ring {
        position: absolute;
        width: 96px;
        height: 96px;
        border-radius: 26px;
        border: 2px solid rgba(245, 158, 11, 0.45);
        animation: preloaderRingPulse 1.8s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .preloader-bar {
        width: 140px;
        height: 3px;
        margin-top: 1.25rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
        opacity: 0;
        animation: preloaderFadeIn 0.4s ease forwards 0.3s;
      }
      .preloader-bar-fill {
        width: 45%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #EA580C, #F59E0B, #FDE68A);
        animation: preloaderSlide 1.1s ease-in-out infinite;
      }
      @keyframes preloaderFadeIn {
        to { opacity: 1; }
      }
      @keyframes preloaderFloat {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-6px) scale(1.04); }
      }
      @keyframes preloaderRingPulse {
        0% { transform: scale(0.92); opacity: 0.8; }
        70% { transform: scale(1.22); opacity: 0; }
        100% { transform: scale(1.22); opacity: 0; }
      }
      @keyframes preloaderSlide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(260%); }
      }
    </style>
  </head>

  <body>
    <div id="preloader">
      <div class="preloader-icon-wrap">
        <div class="preloader-ring"></div>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="76" height="76">
          <defs>
            <linearGradient id="pre-sb" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#C2410C" />
              <stop offset="55%" stop-color="#EA580C" />
              <stop offset="100%" stop-color="#F59E0B" />
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#pre-sb)" />
          <rect x="6" y="6" width="52" height="52" rx="12" stroke="#FEF3C7" stroke-opacity="0.35" stroke-width="1.5" />
          <path d="M32 23C28.5 19.5 22.5 18.5 17 19.5V43.5C22.5 42.5 28.5 43.5 32 47C35.5 43.5 41.5 42.5 47 43.5V19.5C41.5 18.5 35.5 19.5 32 23Z" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M32 23V47" stroke="#FDE68A" stroke-width="2.6" stroke-linecap="round" />
          <path d="M47 13L48.4 16L51.4 17.4L48.4 18.8L47 21.8L45.6 18.8L42.6 17.4L45.6 16L47 13Z" fill="#FDE68A" />
        </svg>
      </div>
      <div class="preloader-logo">Swad<span>Book</span></div>
      <div class="preloader-tagline">India's Shared Recipe Book</div>
      <div class="preloader-bar"><div class="preloader-bar-fill"></div></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
